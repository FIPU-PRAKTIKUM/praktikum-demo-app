# CI pipeline: lint, testovi i build imagea na svaki PR i svaki push na main.
# Objašnjenje linija po liniju: docs/week-06-ci.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Novi push na istu granu otkazuje stari run koji je još u tijeku (štedi minute).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Test
        run: python -m pytest -q

  build:
    needs: test                 # build tek kad lint i testovi prođu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false           # 6. tjedan: samo provjera da se image builda
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # TODO (7. tjedan): push imagea u GHCR na merge u main
  #   - docker/login-action s ${{ secrets.GITHUB_TOKEN }}
  #   - tagovi: sha + latest
  #   - permissions: packages: write

  # TODO (13. tjedan): security
  #   - aquasecurity/trivy-action — image scanning
  #   - secret scanning (gitleaks ili GitHub secret scanning)
