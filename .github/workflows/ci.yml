# CI pipeline — kostur.
# Od 1. tjedna pokreće lint i testove. Ostatak nadograđuješ na vježbama.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt ruff pytest

      - name: Lint
        run: ruff check app

      - name: Test
        run: python -m pytest -q

